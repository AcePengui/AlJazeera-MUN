<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Name</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f5;--surface:#fff;--ink:#1a1a1a;--muted:#5f5f5f;--line:#dcdcdc;--brand:#111;--brand-ink:#fff;--accent:#b86a00;--orange:#f59300;--err:#b3261e;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--surface:#181818;--ink:#eee;--muted:#a8a8a8;--line:#2c2c2c;--brand:#1f1f1f;--accent:#fa9000;--orange:#fa9000;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Roboto,system-ui,sans-serif}
h1,h2,h3,h4{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{background:var(--brand);color:var(--brand-ink)}
.bar{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer}
.brand img{height:36px;width:auto;display:block}
.mark{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 20px Roboto,sans-serif;flex:none}
.logo{font:700 26px Roboto,sans-serif}
.btn{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:9px 16px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid currentColor}
.btn.ghost.gh{color:var(--ink)}
.btn.danger{background:var(--err);color:#fff}
.btn.sm{padding:5px 10px;font-size:14px}
.hide{display:none!important}
.auth{max-width:400px;margin:56px auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:26px}
.auth h1{font-size:30px;margin-bottom:14px}
label{display:block;font-weight:500;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
textarea{min-height:90px;resize:vertical}
.msg{margin:12px 0 0;font-size:14px;color:var(--err)}
.msg.ok{color:var(--accent)}
.tabs{display:flex;gap:6px;margin:22px 0 0;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 14px;border-radius:4px;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin:22px 0 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card .im{aspect-ratio:16/9;background:linear-gradient(135deg,#111,#5a5a5a 55%,#a0a0a0);background-size:cover;background-position:center}
.card div.tx{padding:14px}
.card h3{font:700 19px/1.25 Roboto,sans-serif;margin:4px 0 6px}
.tag{color:var(--accent);font-weight:700;font-size:13px}
.meta{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.panel{max-width:760px;margin:28px auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px}
.chk input{width:auto}
.trow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sub2{font-size:20px;margin-top:26px}

/* article, matches template */
.art{max-width:760px;margin:28px auto 40px;background:var(--surface);padding:22px 24px 28px;border-radius:6px}
.crumbs{display:flex;color:var(--muted);font-size:18px}
.crumbs span+span{border-left:3px solid var(--line);padding-left:12px;margin-left:12px}
.art h1{font:700 34px/1.15 Roboto,sans-serif;margin:12px 0 8px}
.subtext{font:italic 400 19px/1.4 Newsreader,Georgia,serif;color:var(--muted);margin:0 0 6px}
.tools{display:flex;gap:26px;align-items:center;margin:16px 0;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font-size:16px;padding:4px 0}
.tool.on svg{fill:currentColor}
.hero{width:100%;display:block;max-height:520px;object-fit:cover}
.cap{font:italic 400 15px Roboto,sans-serif;color:var(--muted);margin:8px 0 18px}
.by{display:flex;align-items:center;gap:14px;color:var(--muted)}
.av{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none}
.upd{color:var(--muted);margin:8px 0 18px}
.body p{font:400 19px/1.7 Newsreader,Georgia,serif;margin:0 0 1em}
.subt{font:700 26px/1.2 Roboto,sans-serif;margin:28px 0 10px}
.fig{margin:22px 0}
.fig img{width:100%;border-radius:28px;display:block}
.rec{border-top:3px solid var(--line);border-bottom:3px solid var(--line);padding:14px 22px;margin:28px 0}
.rec h4{margin:0 0 10px;font:400 14px Roboto,sans-serif;color:var(--muted);text-transform:uppercase}
.rec ul{list-style:none;margin:0;padding:0}
.rec li{display:flex;align-items:center;gap:14px;padding:5px 0;font-weight:700;cursor:pointer}
.rec li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--orange);flex:none}

/* editor on template */
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 24px;margin-top:14px}
.tpl input,.tpl textarea,.tpl select{background:transparent;border:1px dashed var(--line)}
.t-title{font:700 30px/1.2 Roboto,sans-serif!important}
.t-sub{font:italic 400 19px/1.4 Newsreader,Georgia,serif!important;min-height:60px}
.t-h{font:700 24px Roboto,sans-serif!important}
.t-p{font:400 18px/1.6 Newsreader,Georgia,serif!important;min-height:130px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.eb{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.eb input{flex:1;min-width:180px}
.prev{max-width:100%;max-height:260px;display:block;margin:8px 0;border-radius:6px}
.blk{border:1px solid var(--line);border-radius:6px;padding:12px;margin:14px 0;background:var(--bg)}
.blk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.blk-top span{display:flex;gap:6px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:14px;border-top:3px solid var(--orange)}
.edtop{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.edtop h2{margin-right:auto;font:700 20px Roboto,sans-serif}

/* footer, matches template */
footer{border-top:2px solid var(--orange);margin-top:40px;padding:10px 0 40px;background:var(--surface)}
footer details{padding:10px 4px;max-width:760px;margin:0 auto}
footer summary{font:700 17px 'Roboto Slab',serif;color:var(--muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
footer summary::-webkit-details-marker{display:none}
footer summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px}
footer details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
footer details a{display:block;padding:5px 0;color:var(--muted)}
footer details a:hover{text-decoration:underline}
.follow{text-align:center;color:var(--muted);margin-top:22px}
.follow a{display:inline-block;margin:12px 0;color:var(--ink)}
.flogo{text-align:center;font:700 26px Roboto,sans-serif}
.flogo img{height:44px;width:auto}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="brand" id="home" tabindex="0" role="link"></div>
  <span id="who" class="meta" style="color:inherit;opacity:.8"></span>
  <button class="btn hide" id="newBtn">New article</button>
  <button class="btn ghost hide" id="setBtn">Site settings</button>
  <button class="btn ghost" id="inBtn">Log in</button>
  <button class="btn ghost hide" id="outBtn">Log out</button>
</div></header>

<main class="wrap">
  <section id="authV" class="auth">
    <h1 id="authT">Log in</h1>
    <label for="em" id="emL">Username or email</label><input id="em" autocomplete="username" autocapitalize="none">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="6">
    <div class="row"><button class="btn" id="authGo">Log in</button><button class="btn ghost gh" id="authSw">Create account</button><button class="btn ghost gh" id="authSkip">Back to articles</button></div>
    <p class="msg" id="authM" role="status"></p>
  </section>

  <section id="listV" class="hide">
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>

  <article id="artV" class="art hide"></article>

  <section id="edV" class="hide" style="max-width:760px;margin:0 auto 28px">
    <div class="edtop">
      <h2 id="edT">New article</h2>
      <button class="btn ghost gh" id="ePrev">Preview</button>
      <button class="btn" id="eSave">Save</button>
      <button class="btn ghost gh" id="eCancel">Cancel</button>
      <button class="btn danger hide" id="eDel">Delete</button>
    </div>
    <p class="msg" id="eM" role="status"></p>
    <div class="panel" style="margin:14px 0 0">
      <div class="mgrid">
        <div><label for="eSec">Topic</label><select id="eSec"></select></div>
        <div><label for="eTag">Second crumb (e.g. Recap)</label><input id="eTag"></div>
        <div><label for="eMin">Minutes</label><input id="eMin" type="number" min="1" max="120"></div>
      </div>
      <label class="chk"><input type="checkbox" id="ePub"> Published</label>
    </div>
    <div class="tpl">
      <label for="eTitle">Title</label><input id="eTitle" class="t-title" placeholder="Title">
      <label for="eSum">Sub text</label><textarea id="eSum" class="t-sub" placeholder="Sub text"></textarea>
      <label>Main image</label>
      <img id="hPrev" class="prev hide" alt="">
      <div class="eb"><button class="btn sm" id="hUp">Upload image</button><input id="eImg" type="url" placeholder="or paste image URL"></div>
      <label for="eCap">Image description</label><input id="eCap">
      <label for="eAut">Author</label>
      <div class="eb"><img id="avPrev" class="av hide" alt=""><input id="eAut" placeholder="Author name"><button class="btn sm" id="avUp">Upload photo</button></div>
      <input id="eAv" type="url" placeholder="or paste author photo URL">
      <div id="blocks"></div>
      <div class="addbar">
        <button class="btn ghost sm gh" id="addH">+ Subtitle</button>
        <button class="btn ghost sm gh" id="addP">+ Text</button>
        <button class="btn ghost sm gh" id="addI">+ Image</button>
        <button class="btn ghost sm gh" id="addR">+ Recommended stories</button>
      </div>
    </div>
  </section>

  <section id="setV" class="panel hide">
    <h2>Site settings</h2>
    <label for="sName">Site name</label><input id="sName">
    <label for="sLogo">Logo image URL (blank for default mark)</label>
    <div class="eb"><input id="sLogo" type="url" placeholder="https://"><button class="btn sm" id="sUp">Upload logo</button></div>
    <label for="sInsta">Instagram link</label><input id="sInsta" type="url" placeholder="https://instagram.com/...">
    <h3 class="sub2">Footer groups (one link per line: Label | URL)</h3>
    <label for="fAbout">About</label><textarea id="fAbout"></textarea>
    <label for="fConnect">Connect</label><textarea id="fConnect"></textarea>
    <label for="fChannels">Our Channels</label><textarea id="fChannels"></textarea>
    <label for="fNetwork">Our Network</label><textarea id="fNetwork"></textarea>
    <div class="row"><button class="btn" id="sSave">Save</button><button class="btn ghost gh" id="sBack">Back</button></div>
    <h3 class="sub2">Topics</h3>
    <div id="tList"></div>
    <div class="row"><input id="tNew" placeholder="New topic" style="flex:1"><button class="btn" id="tAdd">Add topic</button></div>
    <p class="msg" id="sM" role="status"></p>
  </section>
</main>

<footer id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://sotunzsipglivppdsthd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvdHVuenNpcGdsaXZwcGRzdGhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMTc3MTMsImV4cCI6MjExMDc5MzcxM30.PKHn7jKfSxnjCQisFgpi2ExzBLthh1vuWmpGtbMnQZw";
const USER_DOMAIN = "users.example.com";
const DEFAULT_FOOTER = { about: "About us | #\nContact | #", connect: "Newsletter | #\nSocial | #", channels: "Channel one | #\nChannel two | #", network: "Partner one | #\nPartner two | #" };
const ICON = {
  head: '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-1a7 7 0 0 1 14 0v1h-2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg>',
  save: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  share: '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><g fill="currentColor"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/></g><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4" stroke="currentColor" stroke-width="2.2"/></svg>',
  insta: '<svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>'
};

/* Login is kept in memory only: nothing is saved in the browser, so opening the page
   (or a new tab/computer) always starts logged out, and logins never sync between tabs. */
try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false }
});
const $ = id => document.getElementById(id);
let session = null, isAdmin = false, articles = [], topics = [], settings = { site_name: "Site Name", logo_url: null };
let section = "All", editing = null, signup = false, draft = null;
const dbgInfo = {};

const toEmail = v => {
  v = v.trim();
  if (v.includes("@")) return v;
  return [...new TextEncoder().encode(v)].map(b => b.toString(16).padStart(2, "0")).join("") + "@" + USER_DOMAIN;
};
function show(v){
  if (window.speechSynthesis) speechSynthesis.cancel();
  ["authV","listV","artV","edV","setV"].forEach(x => $(x).classList.toggle("hide", x !== v));
  window.scrollTo(0,0);
}
function msg(el, t, ok){ el.textContent = t || ""; el.classList.toggle("ok", !!ok); }
function fmt(d){ return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function ago(d){
  const m = Math.floor((Date.now() - new Date(d)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
  const h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const dd = Math.floor(h / 24);
  return dd < 30 ? dd + (dd === 1 ? " day ago" : " days ago") : fmt(d);
}
function btn(text, cls, fn){ const b = document.createElement("button"); b.className = cls; b.textContent = text; b.onclick = fn; return b; }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const safeUrl = u => /^(https?:\/\/|#|\/|mailto:)/i.test(u) ? u : "#";

/* ---------- meta, brand, footer ---------- */
async function loadMeta(){
  const s = await db.from("site_settings").select("*").eq("id", 1).maybeSingle();
  if (s.data) settings = s.data;
  dbgInfo.settings = s.error ? s.error.message : (s.data ? "ok" : "no row");
  const t = await db.from("topics").select("*").order("sort").order("id");
  topics = t.data || [];
  dbgInfo.topics = t.error ? t.error.message : topics.length + " rows";
  renderBrand(); renderFooter();
}
function renderBrand(){
  const b = $("home"); b.replaceChildren();
  if (settings.logo_url){ const i = el("img"); i.alt = ""; i.src = settings.logo_url; b.appendChild(i); }
  else b.appendChild(el("span", "mark", (settings.site_name || "S").trim().charAt(0).toUpperCase()));
  b.appendChild(el("span", "logo", settings.site_name));
  document.title = settings.site_name;
}
function renderFooter(){
  const f = $("foot"); f.replaceChildren();
  const cfg = Object.assign({}, DEFAULT_FOOTER, settings.footer || {});
  [["about","About"],["connect","Connect"],["channels","Our Channels"],["network","Our Network"]].forEach(([k, label]) => {
    const d = el("details"); d.appendChild(el("summary", "", label));
    String(cfg[k] || "").split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
      const p = l.split("|"), a = el("a", "", p[0].trim()); a.href = safeUrl((p[1] || "#").trim()); a.rel = "noopener"; d.appendChild(a);
    });
    f.appendChild(d);
  });
  const fo = el("div", "follow", "Follow " + settings.site_name + ":"); f.appendChild(fo);
  const w = el("div", "follow");
  if (settings.instagram_url){ const a = el("a"); a.href = safeUrl(settings.instagram_url); a.rel = "noopener"; a.setAttribute("aria-label", "Instagram"); a.innerHTML = ICON.insta; w.appendChild(a); }
  f.appendChild(w);
  const lg = el("div", "flogo");
  if (settings.logo_url){ const i = el("img"); i.alt = settings.site_name; i.src = settings.logo_url; lg.appendChild(i); } else lg.textContent = settings.site_name;
  f.appendChild(lg);
}

/* ---------- auth / session ---------- */
async function boot(){
  await loadMeta();
  const { data } = await db.auth.getSession();
  await setSession(data.session);
  db.auth.onAuthStateChange((_e, s) => { if ((s ? s.user.id : null) !== (session ? session.user.id : null)) setSession(s); });
  /* Live sync: site name, logo and footer changes made on any computer show up here instantly. */
  db.channel("site-settings-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "site_settings" }, p => {
      if (p.new && p.new.id === 1){ settings = Object.assign({}, settings, p.new); renderBrand(); renderFooter(); }
    })
    .subscribe();
}
async function setSession(s){
  session = s; isAdmin = false;
  $("outBtn").classList.toggle("hide", !s);
  $("inBtn").classList.toggle("hide", !!s);
  $("who").textContent = s ? (s.user.email.endsWith("@" + USER_DOMAIN) ? "Admin" : s.user.email) : "";
  if (!s){ ["newBtn","setBtn"].forEach(x => $(x).classList.add("hide")); await loadList(); deepLink(); return; }
  const pr = await db.from("profiles").select("role").eq("id", s.user.id).maybeSingle();
  const data = pr.data;
  dbgInfo.profile = pr.error ? pr.error.message : (data ? "role=" + data.role : "no profile row");
  isAdmin = !!data && data.role === "admin";
  ["newBtn","setBtn"].forEach(x => $(x).classList.toggle("hide", !isAdmin));
  await loadList();
  deepLink();
}
let deepDone = false;
function deepLink(){
  if (deepDone) return; deepDone = true;
  const id = new URLSearchParams(location.search).get("a");
  const a = id && articles.find(x => x.id === id);
  if (a) openArticle(a);
}

/* ---------- list ---------- */
async function loadList(){
  await loadMeta();
  const { data, error } = await db.from("articles").select("*").order("created_at",{ascending:false});
  articles = error ? [] : data;
  dbgInfo.articles = error ? error.message : articles.length + " rows";
  if (section !== "All" && !topics.some(t => t.name === section)) section = "All";
  renderList(); show("listV");
}
function renderList(){
  const tabs = $("tabs"); tabs.replaceChildren();
  ["All", ...topics.map(t => t.name)].forEach(s => {
    const b = btn(s, "", () => { section = s; renderList(); });
    b.setAttribute("aria-pressed", s === section); tabs.appendChild(b);
  });
  const grid = $("grid"); grid.replaceChildren();
  const list = articles.filter(a => section === "All" || a.section === section);
  if (!list.length){ grid.appendChild(el("p", "meta", "No articles yet.")); return; }
  list.forEach(a => {
    const c = el("div", "card"); c.tabIndex = 0;
    const im = el("div", "im");
    if (a.image_url) im.style.backgroundImage = "url('" + encodeURI(a.image_url).replace(/'/g,"%27") + "')";
    const tx = el("div", "tx");
    tx.append(el("span", "tag", a.section + (a.published ? "" : " (draft)")), el("h3", "", a.title), el("div", "meta", fmt(a.created_at)));
    c.append(im, tx);
    c.onclick = () => openArticle(a);
    c.onkeydown = e => { if (e.key === "Enter") openArticle(a); };
    grid.appendChild(c);
  });
}

/* ---------- article view (template layout) ---------- */
function blockText(a){
  if (a.blocks && a.blocks.length) return a.blocks.filter(b => b.t === "h" || b.t === "p").map(b => b.text || "");
  return (a.body || "").split(/\n\s*\n/);
}
function savedSet(){ try { return new Set(JSON.parse(localStorage.getItem("saved") || "[]")); } catch (e) { return new Set(); } }
function toggleSaved(id){
  const s = savedSet(); s.has(id) ? s.delete(id) : s.add(id);
  try { localStorage.setItem("saved", JSON.stringify([...s])); } catch (e) {}
  return s.has(id);
}
function tool(icon, label, fn){
  const b = el("button", "tool"); b.type = "button";
  b.innerHTML = icon; b.appendChild(el("span", "", label)); b.onclick = () => fn(b); return b;
}
function renderArticle(a, v, onBack, canEdit){
  v.replaceChildren();
  const cr = el("div", "crumbs");
  [a.section, a.tag].filter(Boolean).forEach(t => cr.appendChild(el("span", "", t)));
  v.append(cr, el("h1", "", a.title));
  if (a.summary) v.appendChild(el("p", "subtext", a.summary));

  const tools = el("div", "tools");
  tools.appendChild(tool(ICON.head, (a.read_minutes || 1) + " mins", () => {
    if (!window.speechSynthesis) return;
    if (speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
    speechSynthesis.speak(new SpeechSynthesisUtterance([a.title, a.summary, ...blockText(a)].filter(Boolean).join(". ")));
  }));
  const sv = tool(ICON.save, "Save", b => {
    if (!a.id) return;
    const on = toggleSaved(a.id); b.classList.toggle("on", on); b.lastChild.textContent = on ? "Saved" : "Save";
  });
  if (a.id && savedSet().has(a.id)){ sv.classList.add("on"); sv.lastChild.textContent = "Saved"; }
  tools.appendChild(sv);
  tools.appendChild(tool(ICON.share, "Share", async b => {
    const url = location.origin + location.pathname + (a.id ? "?a=" + a.id : "");
    if (navigator.share){ try { await navigator.share({ title: a.title, url }); return; } catch (e) { return; } }
    try { await navigator.clipboard.writeText(url); b.lastChild.textContent = "Link copied"; setTimeout(() => b.lastChild.textContent = "Share", 2000); } catch (e) {}
  }));
  v.appendChild(tools);

  if (a.image_url){ const i = el("img", "hero"); i.alt = a.image_caption || ""; i.src = a.image_url; v.appendChild(i); }
  if (a.image_caption) v.appendChild(el("div", "cap", a.image_caption));

  if (a.author){
    const by = el("div", "by");
    if (a.author_avatar){ const i = el("img", "av"); i.alt = ""; i.src = a.author_avatar; by.appendChild(i); }
    const t = el("span", "", "By "); t.appendChild(el("b", "", a.author)); by.appendChild(t);
    v.appendChild(by);
  }
  v.appendChild(el("div", "upd", "Updated: " + ago(a.updated_at || a.created_at)));

  const body = el("div", "body");
  const blocks = a.blocks && a.blocks.length ? a.blocks : (a.body || "").split(/\n\s*\n/).filter(t => t.trim()).map(t => ({ t: "p", text: t }));
  blocks.forEach(b => {
    if (b.t === "h") body.appendChild(el("h2", "subt", b.text || ""));
    else if (b.t === "p") (b.text || "").split(/\n\s*\n/).forEach(t => { if (t.trim()) body.appendChild(el("p", "", t.trim())); });
    else if (b.t === "img" && b.url){
      const f = el("figure", "fig"); f.style.margin = "22px 0";
      const i = el("img"); i.alt = b.caption || ""; i.src = b.url; f.appendChild(i);
      if (b.caption) f.appendChild(el("div", "cap", b.caption));
      body.appendChild(f);
    } else if (b.t === "rec"){
      const items = (b.ids || []).map(id => articles.find(x => x.id === id)).filter(Boolean);
      if (!items.length) return;
      const r = el("div", "rec"); r.appendChild(el("h4", "", "Recommended stories"));
      const ul = el("ul");
      items.forEach(x => { const li = el("li", "", x.title); li.tabIndex = 0; li.onclick = () => openArticle(x); li.onkeydown = e => { if (e.key === "Enter") openArticle(x); }; ul.appendChild(li); });
      r.appendChild(ul); body.appendChild(r);
    }
  });
  v.appendChild(body);

  const row = el("div", "row");
  row.appendChild(btn("Back", "btn ghost gh", onBack));
  if (canEdit) row.appendChild(btn("Edit", "btn", () => openEditor(a)));
  v.appendChild(row);
}
function openArticle(a){ renderArticle(a, $("artV"), () => show("listV"), isAdmin); show("artV"); }

/* ---------- image upload ---------- */
async function uploadImage(file){
  const ext = ((file.name.split(".").pop()) || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png";
  const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  const { error } = await db.storage.from("media").upload(path, file, { contentType: file.type });
  if (error) throw error;
  return db.storage.from("media").getPublicUrl(path).data.publicUrl;
}
function pickImage(cb, out){
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
  i.onchange = async () => {
    const f = i.files[0]; if (!f) return;
    if (f.size > 5 * 1024 * 1024) return msg(out, "Image is over 5 MB.");
    msg(out, "Uploading...", true);
    try { cb(await uploadImage(f)); msg(out, "Uploaded.", true); } catch (e) { msg(out, e.message); }
  };
  i.click();
}

/* ---------- editor (template based) ---------- */
function syncPrev(){
  [["hPrev", "image_url"], ["avPrev", "author_avatar"]].forEach(([id, k]) => {
    const i = $(id); i.classList.toggle("hide", !draft[k]); if (draft[k]) i.src = draft[k];
  });
}
function openEditor(a){
  editing = a || null;
  const blocks = a ? JSON.parse(JSON.stringify(a.blocks || [])) : [];
  if (a && !blocks.length && a.body) a.body.split(/\n\s*\n/).filter(t => t.trim()).forEach(t => blocks.push({ t: "p", text: t.trim() }));
  draft = a ? { section: a.section, tag: a.tag || "", title: a.title, summary: a.summary || "", image_url: a.image_url || "", image_caption: a.image_caption || "",
      author: a.author || "", author_avatar: a.author_avatar || "", read_minutes: a.read_minutes || "", published: a.published, blocks }
    : { section: topics[0] ? topics[0].name : "", tag: "", title: "", summary: "", image_url: "", image_caption: "", author: "", author_avatar: "", read_minutes: "", published: true, blocks: [{ t: "p", text: "" }] };
  $("edT").textContent = a ? "Edit article" : "New article";
  const sel = $("eSec"); sel.replaceChildren();
  const names = topics.map(t => t.name); if (draft.section && !names.includes(draft.section)) names.push(draft.section);
  names.forEach(n => sel.appendChild(el("option", "", n))); sel.value = draft.section;
  [["eTag","tag"],["eMin","read_minutes"],["eTitle","title"],["eSum","summary"],["eImg","image_url"],["eCap","image_caption"],["eAut","author"],["eAv","author_avatar"]]
    .forEach(([id, k]) => { $(id).value = draft[k]; });
  $("ePub").checked = draft.published;
  $("eDel").classList.toggle("hide", !a); msg($("eM"), "");
  syncPrev(); renderBlocks(); show("edV");
}
[["eSec","section"],["eTag","tag"],["eTitle","title"],["eSum","summary"],["eCap","image_caption"],["eAut","author"]].forEach(([id, k]) => $(id).oninput = () => { draft[k] = $(id).value; });
$("eMin").oninput = () => { draft.read_minutes = parseInt($("eMin").value) || ""; };
$("ePub").onchange = () => { draft.published = $("ePub").checked; };
$("eImg").oninput = () => { draft.image_url = $("eImg").value.trim(); syncPrev(); };
$("eAv").oninput = () => { draft.author_avatar = $("eAv").value.trim(); syncPrev(); };
$("hUp").onclick = () => pickImage(u => { draft.image_url = u; $("eImg").value = u; syncPrev(); }, $("eM"));
$("avUp").onclick = () => pickImage(u => { draft.author_avatar = u; $("eAv").value = u; syncPrev(); }, $("eM"));

function mv(i, d){ const j = i + d; if (j < 0 || j >= draft.blocks.length) return; [draft.blocks[i], draft.blocks[j]] = [draft.blocks[j], draft.blocks[i]]; renderBlocks(); }
function renderBlocks(){
  const box = $("blocks"); box.replaceChildren();
  draft.blocks.forEach((b, i) => {
    const w = el("div", "blk"), top = el("div", "blk-top"), ctl = el("span");
    ctl.append(btn("Up", "btn ghost sm gh", () => mv(i, -1)), btn("Down", "btn ghost sm gh", () => mv(i, 1)),
      btn("Remove", "btn danger sm", () => { draft.blocks.splice(i, 1); renderBlocks(); }));
    top.append(el("strong", "", { h: "Subtitle", p: "Text", img: "Image", rec: "Recommended stories" }[b.t]), ctl);
    w.appendChild(top);
    if (b.t === "h"){
      const x = el("input", "t-h"); x.value = b.text || ""; x.placeholder = "Subtitle"; x.oninput = () => { b.text = x.value; }; w.appendChild(x);
    } else if (b.t === "p"){
      const x = el("textarea", "t-p"); x.value = b.text || ""; x.placeholder = "Text"; x.oninput = () => { b.text = x.value; }; w.appendChild(x);
    } else if (b.t === "img"){
      const pv = el("img", "prev"); pv.alt = ""; if (b.url) pv.src = b.url; else pv.classList.add("hide");
      const eb = el("div", "eb"), u = el("input"); u.type = "url"; u.placeholder = "or paste image URL"; u.value = b.url || "";
      u.oninput = () => { b.url = u.value.trim(); pv.classList.toggle("hide", !b.url); if (b.url) pv.src = b.url; };
      eb.append(btn("Upload image", "btn sm", () => pickImage(url => { b.url = url; u.value = url; pv.src = url; pv.classList.remove("hide"); }, $("eM"))), u);
      const c = el("input"); c.placeholder = "Image description"; c.value = b.caption || ""; c.oninput = () => { b.caption = c.value; };
      w.append(pv, eb, c);
    } else if (b.t === "rec"){
      const others = articles.filter(x => !editing || x.id !== editing.id);
      if (!others.length) w.appendChild(el("p", "meta", "No other articles to recommend yet."));
      others.forEach(x => {
        const l = el("label", "chk"), c = el("input"); c.type = "checkbox"; c.checked = (b.ids || []).includes(x.id);
        c.onchange = () => { const s = new Set(b.ids || []); c.checked ? s.add(x.id) : s.delete(x.id); b.ids = [...s]; };
        l.append(c, document.createTextNode(" " + x.title)); w.appendChild(l);
      });
    }
    box.appendChild(w);
  });
}
$("addH").onclick = () => { draft.blocks.push({ t: "h", text: "" }); renderBlocks(); };
$("addP").onclick = () => { draft.blocks.push({ t: "p", text: "" }); renderBlocks(); };
$("addI").onclick = () => { draft.blocks.push({ t: "img", url: "", caption: "" }); renderBlocks(); };
$("addR").onclick = () => { draft.blocks.push({ t: "rec", ids: [] }); renderBlocks(); };

$("ePrev").onclick = () => {
  renderArticle(Object.assign({ created_at: new Date().toISOString(), id: null }, draft), $("artV"), () => show("edV"), false);
  show("artV");
};
$("eSave").onclick = async () => {
  const d = draft;
  if (!d.title.trim()) return msg($("eM"), "Title is required.");
  const row = { section: d.section, tag: d.tag.trim() || null, title: d.title.trim(), summary: d.summary.trim() || null,
    image_url: d.image_url || null, image_caption: d.image_caption.trim() || null, author: d.author.trim() || null,
    author_avatar: d.author_avatar || null, read_minutes: d.read_minutes || null, published: d.published,
    blocks: d.blocks, body: "", updated_at: new Date().toISOString() };
  msg($("eM"), "Saving...", true);
  const { error } = await (editing ? db.from("articles").update(row).eq("id", editing.id) : db.from("articles").insert(row));
  if (error) return msg($("eM"), error.message);
  await loadList();
};
$("eDel").onclick = async () => {
  if (!editing || !confirm("Delete this article?")) return;
  const { error } = await db.from("articles").delete().eq("id", editing.id);
  if (error) return msg($("eM"), error.message);
  await loadList();
};
$("eCancel").onclick = () => show("listV");
$("newBtn").onclick = () => openEditor(null);

/* ---------- settings ---------- */
function renderTopics(){
  const l = $("tList"); l.replaceChildren();
  topics.forEach(t => {
    const r = el("div", "trow");
    r.append(el("span", "", t.name), btn("Delete", "btn danger sm", async () => {
      if (!confirm("Delete topic " + t.name + "? Articles keep their text label.")) return;
      const { error } = await db.from("topics").delete().eq("id", t.id);
      if (error) return msg($("sM"), error.message);
      await loadMeta(); renderTopics(); msg($("sM"), "Topic deleted.", true);
    }));
    l.appendChild(r);
  });
}
$("setBtn").onclick = () => {
  const f = Object.assign({}, DEFAULT_FOOTER, settings.footer || {});
  $("sName").value = settings.site_name; $("sLogo").value = settings.logo_url || ""; $("sInsta").value = settings.instagram_url || "";
  $("fAbout").value = f.about; $("fConnect").value = f.connect; $("fChannels").value = f.channels; $("fNetwork").value = f.network;
  msg($("sM"), ""); renderTopics(); show("setV");
};
$("sUp").onclick = () => pickImage(u => { $("sLogo").value = u; }, $("sM"));
$("sSave").onclick = async () => {
  const site_name = $("sName").value.trim();
  if (!site_name) return msg($("sM"), "Site name is required.");
  const { error } = await db.from("site_settings").upsert({ id: 1, site_name, logo_url: $("sLogo").value.trim() || null,
    instagram_url: $("sInsta").value.trim() || null,
    footer: { about: $("fAbout").value, connect: $("fConnect").value, channels: $("fChannels").value, network: $("fNetwork").value } });
  if (error) return msg($("sM"), error.message);
  await loadMeta(); msg($("sM"), "Saved.", true);
};
$("tAdd").onclick = async () => {
  const name = $("tNew").value.trim();
  if (!name) return;
  const { error } = await db.from("topics").insert({ name, sort: topics.length });
  if (error) return msg($("sM"), error.message);
  $("tNew").value = ""; await loadMeta(); renderTopics(); msg($("sM"), "Topic added.", true);
};
$("sBack").onclick = () => loadList();

/* ---------- nav and auth form ---------- */
$("home").onclick = () => show("listV");
$("inBtn").onclick = () => { msg($("authM"), ""); show("authV"); };
$("authSkip").onclick = () => show("listV");
$("home").onkeydown = e => { if (e.key === "Enter") $("home").click(); };
$("outBtn").onclick = async () => { await db.auth.signOut(); };
$("authSw").onclick = () => {
  signup = !signup;
  $("authT").textContent = signup ? "Create account" : "Log in";
  $("emL").textContent = signup ? "Email" : "Username or email";
  $("authGo").textContent = signup ? "Sign up" : "Log in";
  $("authSw").textContent = signup ? "I have an account" : "Create account";
  $("pw").autocomplete = signup ? "new-password" : "current-password";
  msg($("authM"), "");
};
$("authGo").onclick = async () => {
  const raw = $("em").value.trim(), password = $("pw").value;
  if (!raw || password.length < 6) return msg($("authM"), "Enter your login and a 6+ character password.");
  msg($("authM"), "Working...", true);
  if (signup){
    if (!raw.includes("@")) return msg($("authM"), "Use a real email to sign up.");
    const { data, error } = await db.auth.signUp({ email: raw, password });
    if (error) return msg($("authM"), error.message);
    if (!data.session) msg($("authM"), "Check your email to confirm, then log in.", true);
  } else {
    const { error } = await db.auth.signInWithPassword({ email: toEmail(raw), password });
    if (error) return msg($("authM"), /invalid login/i.test(error.message) ? "Wrong login or password, or the admin user was not created." : error.message);
  }
};
[$("em"), $("pw")].forEach(i => i.onkeydown = e => { if (e.key === "Enter") $("authGo").click(); });

boot();
</script>
